version: 1

protected_paths:
  - "calibration_graph"
  - "Script"

approval:
  run_ttl_minutes: 60
  state_commit_ttl_minutes: 60
  max_auto_retries_per_approval: 2
  require_interactive_tty: true

# One human approval delegates only the bounded actions below. A null total-run
# limit is intentional; the per-(node, qubit) attempt limit remains mandatory.
autonomy:
  # Default budget when automatic-mode entry does not name one.
  duration_hours: 8
  # Operator instruction 2026-09-20: entry may request a different budget for
  # that session, because a ten-qubit bring-up through the statistics nodes
  # does not fit in eight hours. The human still approves the actual number on
  # the Dashboard; this is the ceiling an agent may ask for.
  max_duration_hours: 24
  # Operator decision 2026-10-20: the Approval page offers exactly these
  # budgets (default the first). The clock starts at the approval.
  duration_choices_hours: [8, 16, 24]
  # Operator decision 2026-10-20: "全自動判斷模式", ticked on the Approval
  # page. Pauses that used to wait for a person are decided by JY itself:
  # an unrecognized worker crash or an analyzer exception is retried, a
  # target that keeps failing (or that times out alone on submission) is
  # marked incomplete at that node, and an instrument outage resumes on its
  # own once the QOP answers again. Before each automatic retry JY closes
  # this chip's stale quantum machine and its running job. The three halt
  # conditions and the lease expiry always stay with the operator.
  auto_judgement:
    max_per_node_qubit: 2
    max_per_lease: 10
    instrument_probe_interval_seconds: 60
    close_stale_qm: true
    qm_cleanup_timeout_seconds: 120
  max_total_runs: null
  max_attempts_per_node_qubit: 20
  auto_state_commit_analysis_statuses: ["pass"]
  # Operator instruction 2026-09-20. A run whose overall analysis_status is
  # `needs_review` may still commit the subset of qubits that individually
  # passed every check, because the node refuses a further run once a target is
  # resolved and the calibrated value would otherwise be lost for good. Only
  # per-target passing evidence is ever committed; a failure that belongs to the
  # run as a whole still blocks every target. Set to false to restore the
  # older all-or-nothing behaviour.
  partial_pass_state_commit: true
  pause_on_analysis_statuses: []
  emergency_stop_grace_seconds: 30
  watchdog_interval_seconds: 2
  # Operator instruction 2026-09-20. A refusal that happens before the worker
  # reaches hardware is a correctable planning error, not a loss of control:
  # nothing ran, so refusing the action is the whole protection and ending the
  # lease only costs a new human approval. `parameter_policy_violation` and
  # out-of-scope requests therefore no longer halt; they are refused and
  # recorded. An unrecognized worker exception now pauses the lease for the
  # operator (resumable with `恢復量測`) instead of ending it; with full-auto
  # judgement (`auto_judgement` above) it is retried instead. Only the
  # conditions below, which all mean JY can no longer account for the hardware
  # or the state file, still halt.
  halt_conditions:
    - "snapshot_missing"
    - "state_hash_conflict"
    - "hardware_lock_anomaly"
  # Operator instruction 2026-09-20. A QMTimeoutError is not by itself an
  # outage. The worker separates three causes before deciding whether to stop:
  # a program too large to submit (the deadline expired in a `qm` frame that
  # submits a program, the gRPC status was DEADLINE_EXCEEDED, and a probe right
  # after the failure got the QOP to answer a health check), a wedged or dead
  # QOP, and a network fault. Only the first keeps the lease running, and only
  # while more than one target was attempted, so the agent can halve the
  # multiplex group without an operator. See `rules/PLAYBOOK.md`, "Halve the
  # multiplex group when a run times out on submission".
  multiplex_submission_timeout:
    halving_ladder: "all -> half -> half again -> single"
    keep_lease_active: true
    escalate_at_single_target: true
  # A worker exception matching one of these signatures is a parameter the
  # protected node itself rejects: deterministic, reproducible, and fixed by
  # choosing a different value. The lease stays active so the agent can correct
  # the parameter; it must never resend the value that crashed. Every other
  # worker exception pauses the lease for the operator (or, under full-auto
  # judgement, is retried and then marked incomplete). Add an entry only
  # together with its `rules/experiences/<node>.md` lesson.
  # 2026-10-07: the extras keys each node assigns inside Qualibrate's
  # record_state_updates(), which reads the old value first and raises KeyError
  # when the key is missing (02x on CRSQ_26009_die(-1,3): bare_resonator_freq).
  # jy_request_node_extras_prerequisites adds every missing key for the nodes
  # still ahead with a 0.0 placeholder that the measurement then replaces.
  # Operator choice 2026-10-07: a new chip's template readout pulses (up to
  # 100 us) made every multiplexed point wait for the longest one. Before the
  # readout nodes, jy_request_readout_length_normalize caps the readout length
  # and depletion time at these values; 07d later picks each qubit's length.
  # Operator request 2026-10-13: 07d may pick readouts up to ~4000 ns, so the
  # cap no longer trims them (depletion keeps its 2000 ns cap).
  # Operator instruction 2026-10-15: before 03a every target reads out for
  # 10000 ns (set, not just capped, while the qubit has no 03a run); a qubit's
  # first entry into 03a drops it to 4000 ns. The cap itself is 10000 ns.
  readout_length_normalize_ns: 10000
  pre_03a_readout_length_ns: 10000
  first_03a_readout_length_ns: 4000
  readout_depletion_normalize_ns: 2000
  node_extras_prerequisites:
    "02x": ["bare_resonator_freq"]
    "02c": ["dressed_resonator_freq"]
    "02a": ["dressed_resonator_freq"]
    "02b": ["dressed_resonator_freq", "FluxPeriodV"]
    "03a": ["idle_freq"]
    "03b": ["idle_freq", "sweetspot_freq"]
    "06": ["idle_freq"]
    "06a": ["idle_freq", "sweetspot_freq"]
    "07b": ["readout_fidelity"]
    # 2026-10-12: 10a's record_state_updates reads the old EPG/EPC first
    # (KeyError 'EPG' on 2026-10-04).
    "10a": ["EPG", "EPC"]
    # 2026-10-13: the statistics scripts' record_state_updates read the old
    # value first (06st_t2e KeyError 'T2' on q1, run 6c686000).
    "05st": ["T1", "T1_dev"]
    "06st_t2star": ["T2ramsey", "T2ramsey_dev"]
    "06st_t2e": ["T2", "T2_dev"]
  recoverable_worker_exceptions:
    - id: "02c_fractional_power_limits"
      nodes: ["02c"]
      exception_types: ["ValidationError"]
      message_markers: ["int_from_float", "min_power_dbm", "max_power_dbm"]
      parameters: ["min_power_dbm", "max_power_dbm"]
      remedy: >-
        02c types min_power_dbm/max_power_dbm as int. Use whole-number dBm
        limits and change the integer window width or num_power_points instead
        of a fractional endpoint.
    - id: "03a_arbitrary_frequency_before_flux_calibration"
      nodes: ["03a"]
      exception_types: ["ZeroDivisionError"]
      message_markers: ["float division by zero"]
      parameters: ["arbitrary_qubit_frequency_in_ghz"]
      remedy: >-
        freq_vs_flux_01_quad_term is still zero this early in bring-up. Move the
        scan with jy_request_03a_candidate_center or
        jy_request_03a_window_shift, which only touch LO and IF.
    # Operator decision 2026-09-20, after run
    # 450064c6223f4f16bb1f71d6dbb15efc: the program was submitted and executed,
    # then the QOP failed while streaming results back. A probe immediately
    # afterwards completed a cluster health check, so the instrument was
    # healthy. Treat it like an oversized program on the downstream side and
    # halve the multiplex group, exactly as for a submission timeout.
    - id: "fetch_stage_data_fetching_error"
      nodes: []
      exception_types: ["DataFetchingError"]
      message_markers: ["unexpected error in rpc handling"]
      parameters: ["qubits"]
      remedy: >-
        The QOP accepted and ran the program but failed to stream the results
        back. Halve the multiplex group and repeat the node, continuing to
        halve on further failures; a single target that still fails this way
        is not a data-volume problem and goes to the operator.

# Thermal reset is the safe default everywhere. Active reset is evidence-gated
# per qubit by an active-reset 07b run that reaches
# reset_policy.active_min_readout_fidelity (compact clouds only while
# analysis."07b".active_reset_requires_morphology is true).
# If active reset is used for statistics, all three lifetime baselines must be
# repeated and accepted with active reset before any statistics node may start.
reset_policy:
  default_type: "thermal"
  active_qualification_node: "07b"
  # Operator choice 2026-10-19 (7SQ_4Fa3H die(5,1) q1 active 07b #632: 0.770,
  # 10.6%/9.0% off-blob): active reset qualifies from 0.75 (was 0.80).
  active_min_readout_fidelity: 0.75
  active_statistics_verification_nodes: ["05", "06", "06b"]
  # Operator choice 2026-10-04: after 07b, qubits qualified by an accepted
  # active-reset 07b run use active reset at every later node with a reset
  # parameter (06, 06b, 10a, statistics); the rest stay thermal. Each group
  # has its own shared first batch and the two never share a run.
  group_by_reset_after_qualification: true

# Operator instruction 2026-09-22. Some chips route the XY drive of several
# qubits to a single OPX output. Such a line cannot address one qubit without
# also illuminating its neighbours, it needs high drive power or long gates to
# move any of them, and its LO is shared, so placing one qubit at zero IF moves
# every other qubit on the port. The trigger is the wiring file itself: any two
# qubits sharing `wiring.qubits.<q>.xy.opx_output`.
#
# On such a chip the workflow stops being a node-by-node sweep over all targets
# and becomes a qubit-by-qubit pass: 02, 02x, 02c and 02a still multiplex every
# active target because they only use the readout line, and from
# `serialize_from_node` the workflow takes ONE qubit through the whole remaining
# sequence -- to the end, or until that qubit is scientifically unmeasurable or
# out of attempts -- and only then returns to `serialize_from_node` for the next
# qubit. That is what makes a shared LO safe: the drive LO only moves between
# passes, never inside one.
#
# Operator instruction 2026-10-08: on such a chip `multiplex` is no longer
# offered. The lease page disables it, the server refuses it, and a workflow
# stored with `multiplex` from before this rule still measures one qubit at a
# time, because a shared output always caps the tail at one target.
#
# Operator instruction 2026-10-12: the pass ends early only when a qubit has no
# frequency (03a) or no pi pulse (04) -- `pass_prerequisite_nodes`. Any other
# node that fails or is marked incomplete still hands the qubit to the next
# node. 2026-10-12 later: 05 now runs after 07b in the sequence itself, so the
# 05 -> 07d/07b -> 05 deferral is retired (`deferrable_nodes` is empty).
#
# Operator instruction 2026-10-12: every qubit records the drive LO it uses in
# `extras.xy_lo_freq`. Before each node of a qubit's pass after 03a the LO is
# placed by `jy_request_xy_lo_plan`: one shared LO for every measured qubit when
# a 100 MHz-grid LO keeps all of them within `common_lo_max_if_abs_hz` (room
# for a +-100 MHz scan inside the 400 MHz IF limit), preferring IFs at least
# `lo_min_if_abs_hz` away from the LO leakage; otherwise the qubit's own LO.
# A qubit the shared LO cannot reach is parked at the IF limit -- it is not
# played -- and its real frequency stays in `extras.idle_freq`.
shared_xy_drive:
  serialize_from_node: "03a"
  per_qubit_pass: true
  max_multiplex_targets: 1
  pass_prerequisite_nodes: ["03a", "04"]
  # Operator instruction 2026-10-12: a ticked statistics node runs only for a
  # qubit whose single measurement passed (q1: 05 and 06b passed, 06 did not ->
  # 05st and 06st_t2e run, 06st_t2star is skipped). 10a always runs.
  statistics_sources: {"05st": "05", "06st_t2star": "06", "06st_t2e": "06b"}
  # Operator choice 2026-10-12 (q1, 07b fidelity 55%): the statistics nodes fit
  # 100 short runs each, which a failed discriminator cannot support -- 05st
  # crashed with no usable fit. 2026-10-14: every node with
  # use_state_discrimination may set it true only for qubits whose 07b in this
  # workflow reached analysis."07b".min_readout_fidelity with two Gaussian
  # blobs; the planner proposes false otherwise and the server refuses true.
  statistics_readout_node: "07b"
  deferrable_nodes: {}
  common_lo_max_if_abs_hz: 300000000
  lo_min_if_abs_hz: 20000000

# Operator instruction 2026-10-14: a qubit is measured from scratch when the
# chip config.toml names has no JY run of it -- usually a state folder copied
# from another chip, whose old values would mislead every node. Before its
# first run, jy_request_fresh_qubit_defaults empties its extras (measured
# results) and writes these starting values. A qubit with any run on this chip
# keeps its state. The gate length follows the XY wiring: a shared line (one
# qubit per run) needs a long, weak-drive gate, a private one a short gate.
fresh_qubit_defaults:
  T1_s: 0.0001
  T2ramsey_s: 0.0001
  T2echo_s: 0.0001
  anharmonicity_hz: 200000000
  saturation_amplitude: 0.5
  saturation_length_ns: 20000
  readout_length_ns: 10000
  depletion_time_ns: 2000
  x180_amplitude: 0.05
  x180_length_ns:
    shared_xy: 400
    private_xy: 40

# Operator instruction 2026-10-12: the longest XY gate 04 may use when the
# drive amplitude is already at its limit and the Rabi has not turned over. A
# shared drive line needs long gates (it spreads its power over several
# qubits); a private line keeps fast gates. Operator 2026-10-14: shared
# limit 1000 -> 400 ns.
xy_gate_length_ns:
  min: 16
  step: 4
  shared_max: 400
  private_max: 100

# Operator request 2026-10-04. The autonomy-lease approval page lists these
# nodes as checkboxes (ticked by default); an unticked node is left out of that
# workflow's sequence and of the lease, so the workflow goes straight past it.
# The same page asks for the measurement mode from
# `shared_xy_drive.serialize_from_node` on: `per_qubit` (one qubit through the
# whole tail at a time; recommended when the wiring shares an XY output) or
# `multiplex`. Automatic measurement starts only after that choice; the mode is
# fixed for the rest of the workflow.
#
# Operator request 2026-10-08: the same page asks whether to calibrate flux.
# `nodes` run only on a yes (02b after 02a, 03b after 03a); `optional` nodes are
# extra ticks that need the yes too (06a after 06). A wiring file that routes
# two qubits' Z lines to one OPX output disables the yes: a shared flux line
# cannot move one qubit without moving its neighbours. Without a stored yes the
# flux nodes are left out of every workflow, including conversational ones.
workflow_options:
  optional_nodes: ["02", "06a", "05st", "06st_t2star", "06st_t2e"]
  flux_calibration:
    nodes: ["02b", "03b"]
    optional: ["06a"]

instrument_limits:
  qubit_if_abs_hz: 400000000
  resonator_if_abs_hz: 400000000
  max_sweep_points: 20001
  max_num_averages: 100000
  mw:
    max_wf_amplitude: 1.0
    max_x180_wf_amplitude: 1.0
  iq:
    max_wf_amplitude: 0.5
    max_x180_wf_amplitude: 0.3
  bootstrap_x180_fraction: 0.5
  bootstrap_x90_fraction_of_x180: 0.5
  opx1000_full_scale_power_dbm:
    min: -11
    max: 16
  mw_upconverter_frequency_hz:
    min: 2000000000
    max: 18000000000
  # Operator instruction 2026-09-22. An LO placed near a band edge is a
  # hardware error waiting to happen, so every upconverter frequency must stay
  # at least `mw_band_edge_margin_hz` inside the band its port is configured
  # for. These are the OPX1000 MW-FEM band ranges; correct them here if a
  # future firmware widens them.
  mw_band_frequency_hz:
    1: {min: 50000000, max: 5500000000}
    2: {min: 4500000000, max: 7500000000}
    3: {min: 6500000000, max: 10500000000}
  mw_band_edge_margin_hz: 100000000
  drive_lo_grid_hz: 100000000
  # Operator instruction 2026-10-08: only the statistics nodes may run long.
  # Every other node is meant to finish within this many minutes; nodes with a
  # registered runtime estimate (02b, 03b, 06a) are refused before the hardware
  # when the estimate is longer.
  max_run_minutes: 10
  flux:
    # Operator limits 2026-10-08 (02b sweeps at most +-0.9 V). A committed
    # joint/independent/min offset must stay inside the same range.
    max_offset_abs_v: 0.9
    # QUA amplitude_scale must stay inside [-2, 2); 03b/06a scale the z
    # `const` pulse by sweep_value / const_amplitude.
    max_amplitude_scale: 1.99
  multiplex:
    max_qubits_per_run: 10
    max_qubits_per_readout_line: 12  # operator 2026-10-07 (was 5)
    min_resonator_spacing_hz: 1000000
    max_aggregate_readout_amplitude: 0.5
    # Operator choice 2026-10-07: an over-budget line is scaled to this sum.
    readout_amplitude_budget_target: 0.45

analysis:
  resonator:
    # Operator-supplied RF is already close. 02x/02c/02a only fine-tune.
    max_frequency_span_mhz: 60.0
    # Protected-node fits treat the readout LO (IF=0, detuning −IF) as a peak.
    upconverter_exclusion_hz: 1000000.0
  "02x":
    # Visible interior dip is enough; 02x only fine-tunes stored resonator RF.
    min_robust_snr: 3.0
  # Operator criteria 2026-10-08 for the flux nodes. Each qubit of a 02b run is
  # classified from the resonator trace (dip frequency per flux point):
  #   tunable          -> its offsets commit and it continues to 03b/06a;
  #   flat             -> no flux dependence; resolved, nothing commits, and it
  #                       skips 03b and 06a;
  #   avoided_crossing -> a coupler/neighbour crossing distorts the trace;
  #                       resolved, nothing commits, it skips 03b and 06a, and
  #                       the results page tells the operator to tune the
  #                       neighbouring couplers' flux offsets;
  #   failed           -> no visible dip or an unusable fit; retried as usual.
  # A failed or skipped flux node never removes a qubit from 03a/04/... .
  "02b":
    # Median dip depth over flux points, in robust noise units.
    min_dip_snr: 4.0
    # Flat when the fitted cosine swings less than this many frequency steps
    # (peak to peak) and the trace itself spans less than flat_max_span_steps.
    flat_max_swing_steps: 3.0
    flat_max_span_steps: 4.0
    # A cosine fit explains the trace (inlier R^2) at least this well.
    min_fit_r_squared: 0.8
    # Avoided crossing: >= `crossing_min_points` consecutive flux points sit
    # further than max(outlier_sigma x robust residual, crossing_min_steps
    # steps, crossing_min_fraction_of_swing x cosine swing) from the fit.
    crossing_outlier_sigma: 5.0
    crossing_min_steps: 4.0
    crossing_min_fraction_of_swing: 0.25
    crossing_min_points: 2
    # The fitted idle (sweet-spot) offset keeps clear of the sweep edges.
    min_edge_fraction: 0.05
  "03b":
    # A flux point counts when its strongest spectral feature stands this far
    # above the noise; the parabola needs enough of them.
    min_peak_snr: 4.0
    min_visible_fraction: 0.5
    min_fit_r_squared: 0.7
    # Sweet spot (parabola vertex) clear of the flux sweep edges.
    min_edge_fraction: 0.05
  "06a":
    # Fitted flux offset stays inside this fraction of flux_span (0.4 keeps
    # it clear of the outer 10% at each edge of the +-flux_span/2 window).
    max_offset_fraction_of_span: 0.4
    min_fit_r_squared: 0.5
    min_valid_flux_fraction: 0.5
  "02a":
    # Visible interior dressed dip is enough after 02c has set the point.
    min_robust_snr: 3.0
  "04":
    # q3/q4/q5 reference run: 14.86 / 24.73 / 26.91 at 500 averages.
    # Operator instruction 2026-09-20: lowered from 14.0. A Power Rabi trace
    # with a clean single oscillation and a finite interior Pi fit is already
    # correct well below that anchor; q2 sat at 9.57 with a textbook curve.
    min_robust_snr: 7.0
    noise_confirmation_num_averages: [500, 1000, 2000, 4000]
    max_noise_confirmation_num_averages: 4000
    # Operator instruction 2026-10-12: a qubit that never ran 03b and shows no
    # Rabi oscillation at all -- robust SNR below this after the 4000-average
    # step, or a failed run at the longest allowed gate -- returns to 03a to
    # look for another line, at most `max_returns_to_03a` times. A visible but
    # noisy oscillation keeps being optimised at 04 instead.
    no_rabi_max_robust_snr: 4.0
    max_returns_to_03a: 3
    # Operator instruction 2026-10-12 (q3: 32 ns gate swept to 4% of full
    # scale): "no Rabi" sends a qubit back to 03a only from a run whose
    # amplitude reached this fraction of max_wf_amplitude at the longest
    # allowed XY gate (xy_gate_length_ns shared_max / private_max).
    return_min_amplitude_fraction: 0.9
  "05":
    # q3/q4/q5 reference run: 25.06 / 52.19 / 62.50 at 2000 averages.
    # Operator instruction 2026-10-12: lowered from 25 to 15. Before 07d the
    # CRSQ_26009_die(5,-1) readout gave clean T1 decays at SNR 8-12 that 8000
    # averages could not lift to 25.
    min_robust_snr: 15.0
    # Operator instruction 2026-10-20: T1/T2*/T2e run at most 1000 averages;
    # a run still too noisy at 1000 counts as failed (no averaging ladder).
    noise_confirmation_num_averages: [1000]
    max_noise_confirmation_num_averages: 1000
  "06":
    # Operator instruction 2026-10-15: 06 calibrates the drive frequency on a
    # short window before it measures T2*, so a long first window cannot blur
    # the fringes of a detuned qubit. Per qubit (restarting after a 04 -> 03a
    # return): its first 06 runs at frequency_calibration_max_wait_ns and only
    # corrects the frequency (it never resolves T2*); the next runs stay at
    # that window until one shows both fringes on the detuning (confirmed);
    # then the window lengthens -- to about target_lifetimes x T2* when a fit
    # with relative uncertainty below reliable_relative_uncertainty gives it,
    # otherwise to the next rung of max_wait_ladder_ns. Every run at the
    # calibration window commits its frequency correction.
    # Operator instruction 2026-10-20: the first (calibration) window is
    # 816 ns = 101 points at 8 ns.
    frequency_calibration_max_wait_ns: 816
    max_wait_ladder_ns: [816, 4016, 16016, 40016, 100016]
    target_lifetimes: 4.0
    reliable_relative_uncertainty: 0.5
    # Operator instruction 2026-10-10: a qubit passes 06 only when both
    # Ramsey fringe frequencies (detuning signs -1 and +1) lie within this
    # fraction of the set detuning (1 MHz -> +-200 kHz). A good fit that
    # misses it commits only its frequency correction and is measured again.
    max_fringe_detuning_error_fraction: 0.2
  "06b":
    # Operator instruction 2026-10-12: lowered from 0.9. On CRSQ_26009_die(5,-1)
    # the poor readout gave clean echo decays at R^2 0.88 (q1, T2E 42-47 us).
    min_r_squared: 0.8
  "07b":
    # Operator decision 2026-10-14: 07b is measured once and always passes, so
    # its rotation angle and threshold commit and 05/06b see the decay on I.
    # Fidelity >= min_readout_fidelity AND two separated Gaussian blobs
    # (morphology) are what allow state discrimination (every later node) and
    # active reset; otherwise the report says the readout is not usable for
    # them. 0.70 -> 0.80 the same day, one floor for both.
    min_readout_fidelity: 0.80
    min_readout_fidelity_blocks_pass: false
    morphology_blocks_pass: false
    # Operator instruction 2026-09-21: a thermal 07b result above this
    # fidelity earns one active-reset repeat, and that repeat qualifies the
    # qubit for active reset downstream. One number governs both, so the
    # trigger and the qualification floor are deliberately the same.
    # Operator choice 2026-10-19 (q1 active #632: 0.770, 10.6%/9.0% off-blob):
    # the active-reset repeat qualifies from 0.75 and its clouds may have up to
    # `active_reset_max_outlier_fraction` of shots on neither blob. The thermal
    # trigger that earns the repeat stays at 0.80 with the 5% two-blob test,
    # and so does state discrimination.
    active_reset_min_readout_fidelity: 0.75
    active_reset_trigger_fidelity: 0.80
    active_reset_max_outlier_fraction: 0.15
    # Operator decision 2026-10-14: active reset needs two Gaussian blobs too,
    # both for the thermal trigger and for the active-reset repeat itself.
    active_reset_requires_morphology: true
    # Operator instruction 2026-10-02: judge the IQ clouds as two blobs.
    # Shots on the other blob are readout errors (thermal population, decay)
    # and are counted by fidelity; a cloud fails only when more than
    # `two_blob_max_outlier_fraction` of its shots lie beyond
    # `two_blob_outlier_sigma` of both blob centres (2D Gaussian: 1.1% at 3).
    # The radius-quantile limits below are reported as advisory notes.
    morphology_mode: "two_blob"
    two_blob_outlier_sigma: 3.0
    two_blob_max_outlier_fraction: 0.05
    max_cloud_axis_ratio: 4.0
    max_p95_to_median_radius: 4.0
    max_p99_to_median_radius: 4.0
    min_cloud_samples: 1000
    tail_retry_amplitude_factor: 0.7071067811865476
    min_readout_amplitude: 0.005
  "07d":
    # Operator instruction 2026-10-02: pick the highest fidelity among points
    # whose g/e shots, pooled over +-`neighborhood_points` in frequency and
    # amplitude, have at most `max_outlier_fraction` beyond `outlier_sigma` of
    # both blob centres.
    # Operator decision 2026-10-20: the limit is 5% (as in 07b), and among the
    # points within it JY's raw-shot score picks the one with the lowest
    # separation_weight x blob-overlap error + outlier_weight x off-blob share
    # (5:1, operator 2026-10-21; was 3:1: blob separation counts five times as much as shots on neither
    # blob). The node's fidelity is only reported.
    outlier_sigma: 3.0
    max_outlier_fraction: 0.05
    neighborhood_points: 1
    separation_weight: 5.0
    outlier_weight: 1.0
    # Operator choice 2026-10-03: never above the 02c dressed-limit power. The
    # fidelity tolerance applies only without separation_weight (old rule).
    fidelity_tolerance_percent: 2.0
  "03a":
    initial_coarse_span_mhz: 800.0
    # Operator instruction 2026-10-14: the 03a drive cap follows the XY wiring,
    # which decides how much drive reaches the qubit. A shared XY line (one
    # qubit per run, weak drive) may go up to factor 1.0 and its first 800 MHz
    # coarse run uses exactly initial_coarse_operation_amplitude_factor (1.0,
    # was a 0.10 minimum); a private line (multiplexable) stays at or below
    # 0.05 and its first coarse run uses exactly 0.01.
    initial_coarse_operation_amplitude_factor: 1.0
    max_operation_amplitude_factor_shared_xy: 1.0
    max_operation_amplitude_factor_private_xy: 0.05
    initial_coarse_operation_amplitude_factor_private_xy: 0.01
    coarse_min_span_mhz: 200.0
    # Do not chase 40–50 MHz windows; ~200 MHz is enough for refinement/fine.
    refinement_max_span_mhz: 200.0
    refinement_max_operation_amplitude_factor: 0.10
    final_max_span_mhz: 200.0
    final_max_operation_amplitude_factor: 0.05
    final_min_feature_fwhm_mhz: 0.5
    # Allow a moderately power-broadened fine peak; still reject ~20 MHz blobs.
    final_max_feature_fwhm_mhz: 16.0
    # Visible peak above noise; 5.25 was a documented noise-dominated miss.
    min_robust_snr: 6.0
    min_edge_fraction: 0.05
    two_photon_detection_min_operation_amplitude_factor: 0.075
    two_photon_pair_min_separation_mhz: 50.0
    two_photon_pair_max_separation_mhz: 150.0
    two_photon_lower_max_width_ratio: 0.60
    two_photon_min_peak_snr: 3.0
    two_photon_peak_min_distance_mhz: 10.0
    noise_confirmation_num_averages: [500, 1000, 2000]
    max_noise_confirmation_num_averages: 2000
    # Operator instruction 2026-10-12: a fine scan commits only a line that an
    # earlier 03a run of the same qubit already showed within this distance
    # (or the fine FWHM, if wider), with at least this robust SNR. A line 04
    # rejected (no Rabi) is masked for that qubit by at least this half width.
    reproduce_tolerance_mhz: 5.0
    reproduce_min_robust_snr: 4.5
    rejected_line_min_half_width_mhz: 5.0
    # Operator choice 2026-10-12 (q3 at 2.226 GHz, SNR 5.3-5.9): a coarse line
    # below min_robust_snr is still a credible candidate when two runs put it
    # at the same RF (within the tolerance) from IFs at least the separation
    # apart -- under different LOs, so not a fixed-IF artefact -- each with at
    # least this SNR. The fine scan and 04 still decide.
    cross_lo_min_robust_snr: 5.0
    cross_lo_rf_tolerance_mhz: 5.0
    cross_lo_min_if_separation_mhz: 50.0
    # Operator choice 2026-10-12 (q3 fine #478, SNR 5.58 at 100000 averages): a
    # fine scan of a cross-LO-confirmed line, within the tolerance of its RF,
    # passes from this SNR. Reproducibility and 04 still apply.
    cross_lo_fine_min_robust_snr: 5.0
    # Operator instruction 2026-10-19 (7SQ_4Fa3H die(5,1) q1 at 2.896 GHz,
    # likely f02/2): a fine line commits only after an upward check. The
    # qubit's drive is centred `upper_check_offset_mhz` above the fine line
    # and one 03a run sweeps `upper_check_span_mhz` at coarse drive (shared
    # XY 1.0, private XY its cap). A credible line (min_robust_snr,
    # min_edge_fraction) `upper_check_min/max_separation_mhz` above means
    # the fine line was a multi-photon line: the highest such line becomes
    # the f01 candidate (centre, refinement, low-power fine scan, its own
    # check). No such line confirms the fine line as f01.
    upper_check_span_mhz: 300.0
    upper_check_offset_mhz: 150.0
    upper_check_step_mhz: 1.0
    upper_check_num_averages: 2000
    upper_check_min_separation_mhz: 50.0
    # Operator choice 2026-10-19 (q2 #648: 2.7675 was f03/3, f01 3.0085 GHz
    # lay 241 MHz up): any credible line up to the whole check span counts,
    # and the highest-frequency one is the f01 candidate (f01 is usually the
    # higher, wider line at coarse power; f02/2 narrower and taller, and it
    # fades at low power). Anharmonicity follows the ladder f0k/k = f01 -
    # (k-1) alpha/2: it is recorded only when exactly one order k up to
    # upper_check_max_photon_order gives alpha inside the plausible window
    # and every intermediate f0j/j (2 <= j < k) shows as a peak (SNR >=
    # upper_check_ladder_min_snr) within upper_check_ladder_tolerance_mhz.
    upper_check_max_separation_mhz: 300.0
    upper_check_alpha_min_mhz: 150.0
    upper_check_alpha_max_mhz: 300.0
    upper_check_max_photon_order: 4
    upper_check_ladder_min_snr: 3.0
    upper_check_ladder_tolerance_mhz: 10.0
  "statistics":
    # 2026-10-13 (q1 06st_t2e #493): a statistics node that lost the
    # instrument after 3 of 100 repetitions still saved a summary. A result
    # counts only when at least this many repetitions completed (the dataset's
    # `iteration` size).
    min_completed_iterations: 90
    # Operator choice 2026-10-13: JY refits every repetition, drops fits below
    # these floors and redraws the histogram from the rest; the statistics
    # record (extras.T1/T1_dev, ...) takes that filtered mean and spread.
    refit_min_r_squared: 0.5
    refit_min_snr: 3.0
  "02c":
    # Operator rule 2026-10-11: power rows whose resonance dip is lost in the
    # noise are ignored. The usable range starts at the lowest power from which
    # two consecutive rows reach this (90th percentile - minimum) / noise
    # contrast; the dressed plateau is read from there (CRSQ die(5,-1) q5:
    # rows below about -44 dBm dropped at 100 averages).
    min_power_row_snr: 6.0
    # Operator instruction 2026-10-02: read out below the dressed boundary,
    # so 07d/07b start clear of the bare-resonator transition. 2026-10-13
    # (CRSQ_26009_die(5,-1), q3-q5 not located at -10 dB): 10 -> 3 dB, for
    # every 02c path (analysis patch and state patch). 2026-10-15: 3 -> 5 dB.
    readout_power_backoff_db: 5.0
    # Each readout line's full scale is the smallest integer that keeps every
    # pulse at or below this amplitude (07d's max_readout_amplitude) and the
    # line's summed amplitude at or below
    # instrument_limits.multiplex.max_aggregate_readout_amplitude.
    max_readout_pulse_amplitude: 0.125
    plateau_tail_fraction: 0.20
    min_plateau_points: 4
    # Accept a slightly wander-y plateau when dressed/bare remain distinct.
    plateau_min_coverage: 0.55
    min_frequency_separation_steps: 4.0
    plateau_band_steps: 4.0
    plateau_band_fraction_of_separation: 0.25
    max_plateau_width_steps: 8.0
    max_plateau_width_fraction_of_separation: 0.55
    min_depletion_points: 2
    min_transition_monotonic_fraction: 0.70
    transition_monotonic_slack_fraction: 0.10
    # Telling dressed from bare is the whole acceptance test. Each frequency
    # must own this many consecutive classifiable power points.
    min_classified_plateau_points: 2
    # Operator rule (2026-09-18): the metrics below stay reported as advisory
    # notes and no longer reject a run on their own. Set one to true to make it
    # blocking again.
    require_plateau_stability: false
    require_plateau_width: false
    require_depletion_points: false
    require_transition_monotonic: false
    frequency_edge_fraction: 0.05
    selected_power_tolerance_steps: 2.0
    smoothing_window_points: 3
    bare_only_max_trace_width_steps: 2.0
    bare_only_bare_match_steps: 3.0
    bare_only_required_min_power_dbm: -50.0
    bare_only_max_frequency_span_mhz: 10.0
    bare_only_max_frequency_step_mhz: 0.1
    bare_only_min_num_averages: 200
    bare_only_min_readout_length_ns: 1000
    bare_only_min_low_power_snr: 5.0
    bare_only_min_power_points: 30
    # Operator rule 2026-10-05: a pass needs the frequency window to be about
    # 2-5x the bare-dressed separation, so the dressed-to-bare shift is visible
    # in the plot. A wider window fails and is rescanned narrower, centred
    # between dressed and bare (jy_request_02c_window_recenter).
    min_window_to_separation_ratio: 2.0
    max_window_to_separation_ratio: 5.0
    recommended_window_to_separation_ratio: 3.5
    # A smeared or unstable low-power dressed plateau (q7 2026-10-05: a noise
    # band below -44 dBm read as dressed) blocks; rescan with a shifted power
    # window.
    require_dressed_plateau_quality: true
    # The power window may be shifted but always spans this many dB.
    power_window_db: 40
    max_num_power_points: 30
    max_num_averages: 100

usage:
  # Operator request 2026-10-03: Dashboard usage page. Claude Code transcripts
  # are read from ~/.claude/projects/<repository slug>/ unless transcript_dir
  # is set here. Only token counts are read.
  transcript_dir: null
  pricing:
    # Estimated cost at Anthropic API list prices (USD per million tokens,
    # cached 2026-09-25). A Claude subscription plan is billed differently;
    # this is the API-equivalent cost. Correct the numbers here if prices change.
    cache_write_5m_multiplier: 1.25
    cache_write_1h_multiplier: 2.0
    fast_multiplier: 2.0
    models:
      claude-opus-5-5: {input: 4.0, output: 20.0, cache_read: 0.20}
      claude-sonnet-5-5: {input: 2.0, output: 10.0, cache_read: 0.20}
      claude-fable-5-1: {input: 10.0, output: 50.0, cache_read: 0.25}
      claude-haiku-4-5: {input: 1.0, output: 5.0, cache_read: 0.10}

state_commit:
  allowed_json_pointer_patterns:
    - "^/ports/mw_outputs/[^/]+/[0-9]+/[0-9]+/upconverter_frequency$"
    # Only the readout-LO recentre writes this, together with the output LO.
    - "^/ports/mw_inputs/[^/]+/[0-9]+/[0-9]+/downconverter_frequency$"
    # Only 02c writes this: its JY patch derives the readout-line full scale.
    - "^/ports/mw_outputs/[^/]+/[0-9]+/[0-9]+/full_scale_power_dbm$"
    - "^/qubits/q[0-9]+/xy/intermediate_frequency$"
    - "^/qubits/q[0-9]+/xy/operations/[A-Za-z0-9_-]+/amplitude$"
    # Only the 04 gate-time setup and the fresh-qubit defaults write this
    # (operator 2026-10-12, 2026-10-14).
    - "^/qubits/q[0-9]+/xy/operations/[A-Za-z0-9_-]+/length$"
    # Fresh-qubit defaults only (operator 2026-10-14): DRAG terms reset to 0,
    # the whole extras object emptied, and the starting coherence times and
    # anharmonicity.
    - "^/qubits/q[0-9]+/xy/operations/[A-Za-z0-9_-]+/(alpha|detuning)$"
    - "^/qubits/q[0-9]+/extras$"
    - "^/qubits/q[0-9]+/(T2ramsey|T2echo|anharmonicity)$"
    # Only the XY LO plan writes this: the drive LO a qubit uses (2026-10-12).
    - "^/qubits/q[0-9]+/extras/xy_lo_freq$"
    - "^/qubits/q[0-9]+/resonator/intermediate_frequency$"
    # `length` is 07d's readout-duration output; the others predate it.
    - "^/qubits/q[0-9]+/resonator/operations/readout/(amplitude|full_scale_power_dbm|integration_weights_angle|length)$"
    # Only the readout-length normalize setup writes this (2026-10-07).
    - "^/qubits/q[0-9]+/resonator/depletion_time$"
    # Only the 02x setup writes this, when qubits share a plot cell (2026-10-11).
    - "^/qubits/q[0-9]+/grid_location$"
    # Only the same setup writes this, when qubits share a QUA thread (2026-10-11).
    - "^/qubits/q[0-9]+/(resonator|xy)/thread$"
    - "^/qubits/q[0-9]+/resonator/operations/readout/(threshold|rus_exit_threshold)$"
    - "^/qubits/q[0-9]+/resonator/confusion_matrix$"
    - "^/qubits/q[0-9]+/extras/(bare_resonator_freq|idle_freq|dressed_resonator_freq)$"
    # Only a 03a fine line confirmed by the upward check writes this, with
    # /qubits/qN/anharmonicity (operator 2026-10-19).
    - "^/qubits/q[0-9]+/extras/anharmonicity$"
    # Flux calibration (02b/03b/06a, operator 2026-10-08). The 02b aSWAP
    # amplitude stays out on purpose.
    - "^/qubits/q[0-9]+/z/(joint_offset|independent_offset|min_offset)$"
    - "^/qubits/q[0-9]+/(phi0_voltage|phi0_current|freq_vs_flux_01_quad_term)$"
    - "^/qubits/q[0-9]+/extras/(sweetspot_freq|FluxPeriodV)$"
    - "^/qubits/q[0-9]+/extras/(readout_fidelity|T1|T1_dev|T2ramsey|T2ramsey_dev|T2|T2_dev|EPG|EPC)$"
    - "^/qubits/q[0-9]+/T1$"
    - "^/qubits/q[0-9]+/T2(ramsey|echo)$"
  allowed_operations: ["add", "replace"]
  require_base_hash_match: true
  always_require_human_approval: true

nodes:
  # Operator request 2026-10-04: broadband survey ahead of 02x. One sweep per
  # readout MW input over LO +/- max_if_in_mhz; it removes the electrical delay
  # and lists resonator candidates. Without res_design_freq it is a survey and
  # writes nothing; with it, only qubits whose candidate lies within
  # design_match_tolerance_in_mhz of the globally shifted design move their
  # readout IF. It is an optional node the operator ticks on the lease page,
  # and it runs once with the workflow targets and moves on.
  "02":
    name: "02_Broadband_Spectroscopy"
    script: "02_Broadband_Spectroscopy.py"
    flux_behavior: "hardcoded_min"
    single_pass: true
    # Its result never blocks the workflow; 02x always follows.
    advisory: true
    defaults:
      num_averages: 100
      max_if_in_mhz: 400.0
      frequency_step_in_mhz: 0.1
      readout_length_in_ns: 2000
      readout_power_dbm: null
      res_num: null
      res_design_freq: null
      design_match_tolerance_in_mhz: 10.0
      baseline_window_in_mhz: 15.0
      min_resonator_separation_in_mhz: 5.0
      lo_guard_in_mhz: 10.0
      min_linewidth_in_mhz: 0.3
      detection_snr: 6.0
      simulate: false
      simulation_duration_ns: 2500
      timeout: 100
      load_data_id: null
    allowed_parameters:
      qubits: "qubit_list"
      num_averages: "positive_int"
      max_if_in_mhz: "positive_number"
      frequency_step_in_mhz: "positive_number"
      readout_length_in_ns: "positive_int"
      readout_power_dbm: "optional_number"
      res_num: "optional_positive_int"
      res_design_freq: "optional_positive_number_list"
      design_match_tolerance_in_mhz: "positive_number"
      baseline_window_in_mhz: "positive_number"
      min_resonator_separation_in_mhz: "positive_number"
      lo_guard_in_mhz: "nonnegative_number"
      min_linewidth_in_mhz: "positive_number"
      detection_snr: "positive_number"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"
      load_data_id: "optional_positive_int"

  "02x":
    name: "02x_Bare_Resonator_Spectroscopy"
    script: "02x_Bare_Resonator_Spectroscopy.py"
    flux_behavior: "hardcoded_min"
    # Operator request 2026-10-11 (diagnostic): with all line tones played
    # together, CRSQ_26009_die(5,-1)'s six 02x channels showed one common
    # response (#385, #388) while 02 and 02c resolved distinct resonators.
    # On the chips listed here (QuAM state folder names) 02x measures one
    # qubit per run until the cause is understood.
    single_qubit_devices: []  # CRSQ_26009_die(5,-1) removed 2026-10-11 after the thread fix; re-add if multiplexing still fails
    defaults:
      num_averages: 300
      frequency_span_in_mhz: 20.0
      frequency_step_in_mhz: 0.05
      simulate: false
      simulation_duration_ns: 2500
      timeout: 100
      load_data_id: null
      multiplexed: false
    allowed_parameters:
      qubits: "qubit_list"
      num_averages: "positive_int"
      frequency_span_in_mhz: "positive_number"
      frequency_step_in_mhz: "positive_number"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"
      load_data_id: "optional_positive_int"
      multiplexed: "bool"

  "02a":
    name: "02a_Resonator_Spectroscopy"
    script: "02a_Resonator_Spectroscopy.py"
    flux_behavior: "hardcoded_min"
    defaults:
      num_averages: 300
      frequency_span_in_mhz: 20.0
      frequency_step_in_mhz: 0.05
      simulate: false
      simulation_duration_ns: 2500
      timeout: 100
      load_data_id: null
      multiplexed: false
    allowed_parameters:
      qubits: "qubit_list"
      num_averages: "positive_int"
      frequency_span_in_mhz: "positive_number"
      frequency_step_in_mhz: "positive_number"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"
      load_data_id: "optional_positive_int"
      multiplexed: "bool"

  # Operator request 2026-10-08: flux calibration, run only when the lease page
  # says yes (see workflow_options.flux_calibration). 02b sweeps each qubit's
  # DC flux at the joint flux point, measures the resonator, and fits the
  # cosine: the idle (sweet-spot) offset becomes z.joint_offset, the flux
  # period phi0, and the resonator IF moves to the resonance at that offset.
  # Sweep limits (operator): +-0.9 V, at most 100 flux points.
  "02b":
    name: "02b_Resonator_Spectroscopy_vs_Flux"
    script: "02b_resonator_spectroscopy_vs_flux.py"
    flux_behavior: "joint"
    flux_sweep:
      min_key: "min_flux_offset_in_v"
      max_key: "max_flux_offset_in_v"
      points_key: "num_flux_points"
      max_abs_v: 0.9
      max_points: 100
    defaults:
      num_averages: 300
      min_flux_offset_in_v: -0.9
      max_flux_offset_in_v: 0.9
      num_flux_points: 75
      frequency_span_in_mhz: 7.5
      frequency_step_in_mhz: 0.1
      flux_point_joint_or_independent: "joint"
      input_line_impedance_in_ohm: 50
      line_attenuation_in_db: 0
      update_flux_min: true
      simulate: false
      simulation_duration_ns: 2500
      timeout: 100
      load_data_id: null
    allowed_parameters:
      qubits: "qubit_list"
      num_averages: "positive_int"
      min_flux_offset_in_v: "number"
      max_flux_offset_in_v: "number"
      num_flux_points: "positive_int"
      frequency_span_in_mhz: "positive_number"
      frequency_step_in_mhz: "positive_number"
      flux_point_joint_or_independent: "joint_literal"
      input_line_impedance_in_ohm: "positive_number"
      line_attenuation_in_db: "nonnegative_number"
      update_flux_min: "bool"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"
      load_data_id: "optional_positive_int"

  "02c":
    name: "02c_Resonator_Spectroscopy_vs_Amplitude"
    script: "02c_resonator_spectroscopy_vs_amplitude.py"
    flux_behavior: "joint"
    # Operator request 2026-10-11: multiplexed 02x on this chip reported q6's
    # response on every channel; check 02c one qubit (one tone) per run too.
    single_qubit_devices: []  # CRSQ_26009_die(5,-1) removed 2026-10-11 after the thread fix; re-add if multiplexing still fails
    defaults:
      num_averages: 100
      frequency_span_in_mhz: 16.0  # first pass finds the separation; retries narrow to 2-5x
      frequency_step_in_mhz: 0.03
      simulate: false
      simulation_duration_ns: 2500
      timeout: 100
      max_power_dbm: -10
      min_power_dbm: -50
      num_power_points: 30
      max_amp: 0.5
      flux_point_joint_or_independent: "joint"
      ro_line_attenuation_dB: 0.0
      derivative_crossing_threshold_in_hz_per_dbm: -50000
      derivative_smoothing_window_num_points: 30
      moving_average_filter_window_num_points: 30
      multiplexed: false
      load_data_id: null
    allowed_parameters:
      qubits: "qubit_list"
      num_averages: "positive_int"
      frequency_span_in_mhz: "positive_number"
      frequency_step_in_mhz: "positive_number"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"
      # The protected node's Parameters model types both as `int`; a fractional
      # dBm is rejected by pydantic (`int_from_float`) before anything runs.
      max_power_dbm: "int"
      min_power_dbm: "int"
      num_power_points: "positive_int"
      max_amp: "positive_number"
      flux_point_joint_or_independent: "joint_literal"
      ro_line_attenuation_dB: "number"
      derivative_crossing_threshold_in_hz_per_dbm: "number"
      derivative_smoothing_window_num_points: "positive_int"
      moving_average_filter_window_num_points: "positive_int"
      multiplexed: "bool"
      load_data_id: "optional_positive_int"

  "03a":
    name: "03a_Qubit_Spectroscopy"
    script: "03a_Qubit_Spectroscopy.py"
    flux_behavior: "joint"
    defaults:
      num_averages: 100
      operation: "saturation"
      operation_amplitude_factor: 0.01
      operation_len_in_ns: 20000
      frequency_span_in_mhz: 800.0
      frequency_step_in_mhz: 1.0
      flux_point_joint_or_independent: "joint"
      target_peak_width: 1000000.0
      arbitrary_flux_bias: null
      arbitrary_qubit_frequency_in_ghz: null
      simulate: false
      simulation_duration_ns: 2500
      timeout: 100
      load_data_id: null
      multiplexed: false
    allowed_parameters:
      qubits: "qubit_list"
      num_averages: "positive_int"
      operation: "saturation_literal"
      operation_amplitude_factor: "positive_number"
      operation_len_in_ns: "positive_int"
      frequency_span_in_mhz: "positive_number"
      frequency_step_in_mhz: "positive_number"
      flux_point_joint_or_independent: "joint_literal"
      target_peak_width: "positive_number"
      arbitrary_flux_bias: "optional_number"
      arbitrary_qubit_frequency_in_ghz: "optional_number"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"
      load_data_id: "optional_positive_int"
      multiplexed: "bool"

  # Operator request 2026-10-08: qubit spectroscopy vs a z flux pulse around
  # the 02b offset; a parabola fit moves z.joint_offset to the sweet spot and
  # the drive IF to the qubit frequency there, and stores the quadratic term.
  # Sweep limits (operator): +-0.4 V, at most 100 flux points. Only qubits 02b
  # found tunable run it.
  "03b":
    name: "03b_Qubit_Spectroscopy_vs_Flux"
