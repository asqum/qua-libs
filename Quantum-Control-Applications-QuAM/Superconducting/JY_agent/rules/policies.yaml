  "06":
    name: "06_Ramsey"
    script: "06_Ramsey.py"
    flux_behavior: "joint"
    # Operator instruction 2026-10-02, tightened 2026-10-15: the detuning is
    # inversely proportional to the window, detuning [MHz] x (max - min wait)
    # [ns] = 4000 exactly (20000 ns -> 0.2 MHz), so every Ramsey plot shows four
    # fringes. min wait is always 16 ns and max wait is 16 + 400n ns (operator
    # 2026-10-20; was 500 ns), which puts the 816 ns calibration window on the
    # grid. A run that omits frequency_detuning_in_mhz gets the derived value;
    # any other explicit value is refused before the hardware.
    detuning_wait_product_mhz_us: 4.0
    detuning_wait_product_tolerance: 0.0
    fixed_min_wait_time_in_ns: 16
    max_wait_time_step_in_ns: 400
    # Operator choice 2026-10-15: T2* up to about 25 us.
    max_wait_time_cap_ns: 100016
    # Operator instruction 2026-10-20: at most 1000 averages and 101 points.
    max_num_averages: 1000
    max_time_points: 101
    calibration_max_wait_time_in_ns: 816
    defaults:
      num_averages: 1000
      reset_type: "thermal"
      frequency_detuning_in_mhz: 0.1
      min_wait_time_in_ns: 16
      # The first 06 of a pass is the 816 ns frequency calibration.
      max_wait_time_in_ns: 816
      num_time_points: 101
      log_or_linear_sweep: "linear"
      use_state_discrimination: true
      flux_point_joint_or_independent: "joint"
      load_data_id: null
      multiplexed: true
      use_waveform_report: false
      simulate: false
      simulation_duration_ns: 2500
      timeout: 100
    allowed_parameters:
      qubits: "qubit_list"
      num_averages: "positive_int"
      reset_type: "reset_literal"
      frequency_detuning_in_mhz: "positive_number"
      min_wait_time_in_ns: "positive_int"
      max_wait_time_in_ns: "positive_int"
      num_time_points: "positive_int"
      log_or_linear_sweep: "linear_log_literal"
      use_state_discrimination: "bool"
      flux_point_joint_or_independent: "joint_literal"
      load_data_id: "optional_positive_int"
      multiplexed: "bool"
      use_waveform_report: "bool"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"

