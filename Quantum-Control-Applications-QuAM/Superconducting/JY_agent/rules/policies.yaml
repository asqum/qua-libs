  # Operator instruction 2026-09-21: 07d and 07b each run exactly once, with
  # the node defaults, and the workflow moves on. `single_pass: true` means the
  # node is complete after one analyzed full-width run whatever the analysis
  # says: no retry, no parameter adjustment, no per-target chasing. Passing
  # evidence still commits, because that is the node's output; a target that
  # does not pass simply carries no update.
  "07d":
    name: "07d_Readout_Frequency_Duration_Power_Optimization"
    script: "07d_Readout_Frequency_Duration_Power_Optimization.py"
    flux_behavior: "joint"
    single_pass: true
    # Operator instruction 2026-09-29. The node's measurement batching
    # (quam_libs readout_optimization_3d, _generate_balanced_subsets_indices)
    # slices objects[i:i+S] instead of objects[i*S:(i+1)*S], so above four
    # qubits it silently drops targets and then crashes with KeyError (run
    # 01b027b2fd17411e9c0da43eea488cf6 measured only 6 of 10). Four or fewer is
    # one batch. Single pass then means one run per group of at most four.
    max_multiplex_targets: 4
    # Operator instruction 2026-10-02: 02c now commits the dressed limit minus
    # 10 dB, and the first 07d group's optima all sat at the 1.99 top of the
    # sweep. 3.16 (+10 dB) reaches back up to the dressed limit; 22 points keep
    # the step near the old 0.13. A run on an older value of these keys no
    # longer counts toward single pass.
    # Operator choice 2026-10-13: with the 3 dB 02c backoff, 1.41 (+3 dB)
    # reaches the dressed limit; 22 points give a ~0.06 step. Sweeping past
    # the limit drove q2 into a third IQ cloud (07b #457).
    # Operator choice 2026-10-15: with the 5 dB backoff, 1.778 (+5 dB) reaches
    # the dressed limit; 27 points keep the ~0.06 step. 07d stays single pass:
    # new runs on these defaults count, an earlier 1.41 run gets one more pass.
    # num_runs 40 -> 100 (2026-10-02): the two-blob selection needs shots per
    # point; 9 pooled points x 200 shots resolve a few-% off-blob share.
    single_pass_default_keys: ["max_amplitude_factor", "num_runs"]
    defaults:
      multiplexed: true
      flux_point_joint_or_independent: "joint"
      num_runs: 100
      frequency_span_in_mhz: 6
      frequency_step_in_mhz: 0.2
      min_amplitude_factor: 0.2
      max_amplitude_factor: 1.778
      num_amplitudes: 27
      # Operator request 2026-10-13: up to ~4000 ns (8 durations of 500 ns; the
      # node needs max_duration / num_durations to be a multiple of 4 ns).
      max_duration_in_ns: 4000
      num_durations: 8
      plotting_dimension: "2D"
      fidelity_smoothing_intensity: 0.5
      max_readout_amplitude: 0.125
      load_data_id: null
      simulate: false
      simulation_duration_ns: 10000
      timeout: 100
    allowed_parameters:
      qubits: "qubit_list"
      multiplexed: "bool"
      flux_point_joint_or_independent: "joint_literal"
      num_runs: "positive_int"
      frequency_span_in_mhz: "positive_number"
      frequency_step_in_mhz: "positive_number"
      min_amplitude_factor: "nonnegative_number"
      max_amplitude_factor: "positive_number"
      num_amplitudes: "positive_int"
      max_duration_in_ns: "positive_int"
      num_durations: "positive_int"
      plotting_dimension: "plot_dimension_literal"
      fidelity_smoothing_intensity: "nonnegative_number"
      max_readout_amplitude: "positive_number"
      load_data_id: "optional_positive_int"
      simulate: "bool"
      simulation_duration_ns: "positive_int"
      timeout: "positive_int"

