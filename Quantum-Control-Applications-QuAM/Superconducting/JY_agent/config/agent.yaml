server:
  host: "127.0.0.1"
  port: 8765
  path: "/mcp"

# Review/Approval is a separate HTTP surface. A short-lived Cloudflare quick
# tunnel exposes only this dashboard; MCP stays on loopback. The bootstrap sets
# public_base_url and a runtime-only access token through environment variables.
approval:
  # local | public. The bootstrap uses public while the Cloudflare tunnel is active.
  transport: "local"
  host: "127.0.0.1"
  port: 8766
  public_base_url: ""
  trusted_origins: []
  trusted_proxy_cidrs: ["127.0.0.0/8", "::1/128"]

paths:
  # Qualibrate owns state, wiring, Data, and calibration-library locations.
  runtime: "runtime"

# Empty means: use JY_QUALIBRATE_PYTHON, then the current Python executable.
qualibrate_python: ""

workflow:
  # Operator instruction 2026-09-21: 07d runs immediately before 07b, so the
  # readout frequency/duration/power optimisation lands before the IQ blobs
  # that measure the discriminator it produces.
  # Operator request 2026-10-04: 02 (broadband survey) runs ahead of 02x. It and
  # the statistics nodes are optional; the operator ticks them on the lease
  # approval page (rules/policies.yaml `workflow_options.optional_nodes`).
  # Operator request 2026-10-08: flux calibration 02b (after 02a), 03b (after
  # 03a) and the optional 06a (after 06) run only when the lease page says yes
  # (rules/policies.yaml `workflow_options.flux_calibration`).
  # Operator instruction 2026-10-12: 05 (T1) runs after 07b, on the optimised
  # readout, for every qubit (replaces the 05 -> 07d/07b -> 05 deferral).
  sequence: ["02", "02x", "02c", "02a", "02b", "03a", "03b", "04", "07d", "07b", "05", "06", "06a", "06b", "10a", "05st", "06st_t2star", "06st_t2e"]
  default_flux_point: "joint"
  require_explicit_qubits: true

interaction:
  measurement_mode_entry_phrase: "進入 JY 量測模式"
  measurement_mode_entry_phrases:
    - "進入 JY 量測模式"
    - "進入JY量測模式"
    - "Enter JY measurement mode"
  measurement_mode_exit_phrase: "退出 JY 量測模式"
  measurement_mode_shutdown_phrase: "結束量測"
  measurement_mode_shutdown_phrases:
    - "結束量測"
    - "結束量測模式"
    - "結束 JY 量測模式"
    - "結束JY量測模式"
    - "結束 JY 自動量測模式"
    - "結束JY自動量測模式"
    - "結束 JY 自動量測"
    - "結束JY自動量測"
    - "退出 JY 量測模式"
    - "退出JY量測模式"
    - "退出 JY 自動量測模式"
    - "退出JY自動量測模式"
    - "退出 JY 自動量測"
    - "退出JY自動量測"
    - "停止量測"
    - "停止量測模式"
    - "停止 JY 量測模式"
    - "停止JY量測模式"
    - "停止 JY 自動量測模式"
    - "停止JY自動量測模式"
    - "停止 JY 自動量測"
    - "停止JY自動量測"
    - "End measurement"
    - "Stop measurement"
    - "Exit JY measurement mode"
    - "End JY measurement mode"
    - "Stop JY measurement mode"
    - "Exit JY automatic measurement mode"
    - "End JY automatic measurement mode"
    - "Stop JY automatic measurement mode"
  # Conversational mode uses per-run/per-state review. Autonomous mode requests
  # one bounded lease and may continue the allowlisted bring-up sequence.
  autonomy_mode_entry_phrase: "進入 JY 自動量測模式"
  autonomy_mode_entry_phrases:
    - "進入 JY 自動量測模式"
    - "進入JY自動量測模式"
    - "Enter JY automatic measurement mode"
  # Operator decision 2026-10-20: continue the open workflow's automation. An
  # ended (e.g. expired) lease gets a renewal that copies its scope; its card
  # asks only the hours, full-auto judgement and the approval code; a paused
  # lease resumes; an active one is unchanged.
  autonomy_continue_phrases:
    - "繼續JY自動量測模式"
    - "繼續 JY 自動量測模式"
    - "Continue JY automatic measurement mode"
  recovery_phrases:
    - "恢復"
    - "恢复"
    - "Recover"
  # Resume the same paused workflow/session after an operator verifies instruments.
  measurement_resume_phrases:
    - "恢復量測"
    - "恢复量测"
    - "Resume measurement"
